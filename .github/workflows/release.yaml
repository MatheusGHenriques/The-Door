name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest

    if: github.ref_type == 'tag'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag does not point to a commit reachable from main. Aborting."
            exit 1
          fi

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          VERSION_CODE="${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/thedoor_key.jks"

      - name: Build release APK
        env:
          KEYSTORE_PATH: "${{ runner.temp }}/thedoor_key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate and rename APK
        id: apk
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_NAME="the-door-${VERSION}.apk"
          cp "$APK_SRC" "$RUNNER_TEMP/$APK_NAME"
          echo "name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksum
        id: checksum
        run: |
          APK_PATH="${{ steps.apk.outputs.path }}"
          APK_NAME="${{ steps.apk.outputs.name }}"
          SHA_NAME="${APK_NAME}.sha256"
          sha256sum "$APK_PATH" | awk '{print $1}' > "$RUNNER_TEMP/$SHA_NAME"
          echo "name=$SHA_NAME" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$SHA_NAME" >> "$GITHUB_OUTPUT"

      - name: Install git-cliff
        run: |
          CLIFF_VERSION="1.4.0"
          ARCHIVE="git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/${ARCHIVE}" \
            -o "$RUNNER_TEMP/${ARCHIVE}"
          tar -xzf "$RUNNER_TEMP/${ARCHIVE}" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/git-cliff-${CLIFF_VERSION}" >> "$GITHUB_PATH"

      - name: Generate changelog
        env:
          GITHUB_REPO: ${{ github.repository }}
        run: |
          git-cliff --config cliff.toml --latest --strip header \
            --output "$RUNNER_TEMP/CHANGELOG.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "The Door ${{ steps.version.outputs.tag }}"
          body_path: "${{ runner.temp }}/CHANGELOG.md"
          make_latest: true
          generate_release_notes: false
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.checksum.outputs.path }}
